name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5513f83cff73d40ff9f00" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses

      - name: Install CMake 4.x
        run: |
          pip3 install cmake
          echo "$(python3 -c 'import cmake; print(cmake.CMAKE_BIN_DIR)')" >> $GITHUB_PATH

      - name: Resolve ffmpeg libs
        run: git clone https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ -b audio ffMetadataEx/ffmpeg-android-maker

      - name: Build debug APKs and run jvm tests
        run: ./gradlew assembleCoreDebug assembleFullDebug lintCoreDebug testCoreDebugUnitTest --stacktrace --no-configuration-cache -DskipFormatKtlint

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/*/debug/*.apk
